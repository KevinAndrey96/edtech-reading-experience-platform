services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: edtech_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=database
      - DB_PORT=3306
      - DB_DATABASE=edtech_reading_platform
      - DB_USERNAME=edtech_user
      - DB_PASSWORD=edtech_secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/var/www/html
    networks:
      - edtech_network
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    image: nginx:1.25-alpine
    container_name: edtech_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - edtech_network
    depends_on:
      - app

  database:
    image: mysql:8.0
    container_name: edtech_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret_password
      MYSQL_DATABASE: edtech_reading_platform
      MYSQL_USER: edtech_user
      MYSQL_PASSWORD: edtech_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seeds.sql:/docker-entrypoint-initdb.d/02-seeds.sql:ro
    networks:
      - edtech_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "edtech_user", "-pedtech_secret"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.0-alpine
    container_name: edtech_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - edtech_network

  mailpit:
    image: axllent/mailpit:latest
    container_name: edtech_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - edtech_network

networks:
  edtech_network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
