name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Pint y PHPUnit (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, xml, ctype, intl, pdo_sqlite, pdo_mysql, bcmath, zip, gd, fileinfo
          coverage: none

      - run: composer validate --strict --no-check-publish

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Preparar entorno
        run: |
          cp .env.example .env
          php artisan key:generate

      - run: vendor/bin/pint --test

      - run: php artisan test

  database:
    name: Esquema, semillas y migraciones en MySQL 8.0
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: edtech_reading_platform
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=5s --health-timeout=5s --health-retries=10
    env:
      MYSQL: mysql -h 127.0.0.1 -u root -proot
    steps:
      - uses: actions/checkout@v4

      - name: Cargar schema.sql y seeds.sql
        run: |
          $MYSQL edtech_reading_platform < database/schema.sql
          $MYSQL edtech_reading_platform < database/seeds.sql

      - name: Verificar el catálogo sembrado
        run: |
          count() { $MYSQL -N -s edtech_reading_platform -e "SELECT COUNT(*) FROM $1"; }
          test "$(count regions)" -ge 10
          test "$(count books)" -ge 30
          test "$(count users)" -ge 6
          test "$(count experiences)" -ge 6
          test "$(count evidence)" -ge 6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, xml, intl, pdo_mysql, bcmath, zip
          coverage: none

      - run: composer install --prefer-dist --no-interaction --no-progress

      - name: Ejecutar las migraciones en una base vacía
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: edtech_migrations
          DB_USERNAME: root
          DB_PASSWORD: root
        run: |
          $MYSQL -e "CREATE DATABASE edtech_migrations"
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --force

  docker:
    name: Imagen Docker y Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: docker compose config --quiet

      - run: docker build -f docker/php/Dockerfile -t edtech-reading-platform .
